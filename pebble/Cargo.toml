[package]
name = "blinkr"
version = "0.1.0"
authors = ["Peatral <contact@peatral.xyz>"]
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
bytemuck = { version = "1.14", default-features = false, features = ["derive", "extern_crate_alloc"] }
pebble-rs = { git = "https://github.com/Peatral/pebble-rust.git", branch = "master" }
pebble-sys = { git = "https://github.com/Peatral/pebble-rust.git", branch = "master" }

[build-dependencies]
pebble-build = { git = "https://github.com/Peatral/pebble-rust.git", branch = "master" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = ["emery"]

aplite = ["pebble-rs/aplite"]
basalt = ["pebble-rs/basalt"]
chalk = ["pebble-rs/chalk"]
diorite = ["pebble-rs/diorite"]
emery = ["pebble-rs/emery"]
flint = ["pebble-rs/flint"]
gabbro = ["pebble-rs/gabbro"]
